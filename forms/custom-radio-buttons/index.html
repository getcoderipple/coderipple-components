<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Radio Buttons | CodeRipple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-stage">
<div class="custom-radio-group">

  <label class="custom-radio">

    <input
      type="radio"
      name="plan"
      value="basic"
      checked
    >

    <span class="radio-circle"></span>

    <span class="radio-text">
      Basic
    </span>

  </label>

  <label class="custom-radio">

    <input
      type="radio"
      name="plan"
      value="pro"
    >

    <span class="radio-circle"></span>

    <span class="radio-text">
      Pro
    </span>

  </label>

  <label class="custom-radio">

    <input
      type="radio"
      name="plan"
      value="premium"
    >

    <span class="radio-circle"></span>

    <span class="radio-text">
      Premium
    </span>

  </label>

</div>
  </main>
</body>
</html>
