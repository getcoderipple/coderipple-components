<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Thinking Loader | CodeRipple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cr-ai-loader">

  <div
    class="cr-ai-loader__scene"
    role="status"
    aria-label="AI is thinking"
  >

    <!-- OUTER ENERGY RING -->
    <div class="cr-ai-loader__ring cr-ai-loader__ring--outer">

      <span
        class="cr-ai-loader__node cr-ai-loader__node--one"
      ></span>

      <span
        class="cr-ai-loader__node cr-ai-loader__node--two"
      ></span>

    </div>


    <!-- MIDDLE ORBIT -->
    <div class="cr-ai-loader__ring cr-ai-loader__ring--middle">

      <span class="cr-ai-loader__orbit-dot"></span>

    </div>


    <!-- INNER ORBIT -->
    <div class="cr-ai-loader__ring cr-ai-loader__ring--inner">

      <span class="cr-ai-loader__orbit-dot"></span>

    </div>


    <!-- DATA PARTICLES -->
    <div
      class="cr-ai-loader__particles"
      aria-hidden="true"
    >

      <span class="cr-ai-loader__particle cr-ai-loader__particle--1"></span>
      <span class="cr-ai-loader__particle cr-ai-loader__particle--2"></span>
      <span class="cr-ai-loader__particle cr-ai-loader__particle--3"></span>
      <span class="cr-ai-loader__particle cr-ai-loader__particle--4"></span>
      <span class="cr-ai-loader__particle cr-ai-loader__particle--5"></span>
      <span class="cr-ai-loader__particle cr-ai-loader__particle--6"></span>

    </div>


    <!-- AI CORE -->
    <div class="cr-ai-loader__core">

      <div class="cr-ai-loader__core-glow"></div>

      <div class="cr-ai-loader__core-shell">

        <div
          class="cr-ai-loader__brain"
          aria-hidden="true"
        >

          <span
            class="cr-ai-loader__brain-line cr-ai-loader__brain-line--1"
          ></span>

          <span
            class="cr-ai-loader__brain-line cr-ai-loader__brain-line--2"
          ></span>

          <span
            class="cr-ai-loader__brain-line cr-ai-loader__brain-line--3"
          ></span>


          <span
            class="cr-ai-loader__brain-node cr-ai-loader__brain-node--1"
          ></span>

          <span
            class="cr-ai-loader__brain-node cr-ai-loader__brain-node--2"
          ></span>

          <span
            class="cr-ai-loader__brain-node cr-ai-loader__brain-node--3"
          ></span>

          <span
            class="cr-ai-loader__brain-node cr-ai-loader__brain-node--4"
          ></span>

        </div>

      </div>

      <div class="cr-ai-loader__pulse"></div>

    </div>


    <!-- SIGNAL LINES -->
    <div
      class="cr-ai-loader__signals"
      aria-hidden="true"
    >

      <span class="cr-ai-loader__signal cr-ai-loader__signal--1"></span>
      <span class="cr-ai-loader__signal cr-ai-loader__signal--2"></span>
      <span class="cr-ai-loader__signal cr-ai-loader__signal--3"></span>
      <span class="cr-ai-loader__signal cr-ai-loader__signal--4"></span>

    </div>

  </div>


  <!-- STATUS -->
  <div class="cr-ai-loader__status">

    <div class="cr-ai-loader__status-main">

      <span class="cr-ai-loader__status-light"></span>

      <span class="cr-ai-loader__status-text">
        AI is thinking
      </span>

      <span
        class="cr-ai-loader__typing"
        aria-hidden="true"
      >
        <i></i>
        <i></i>
        <i></i>
      </span>

    </div>


    <div
      class="cr-ai-loader__processing"
      aria-hidden="true"
    >
      <span></span>
    </div>

  </div>

</div>

  
</body>
</html>
