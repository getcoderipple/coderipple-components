<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Skeleton Loader | CodeRipple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cr-skeleton" id="crSkeleton">

  <div class="cr-skeleton__card">

    <!-- PROFILE -->
    <div class="cr-skeleton__profile">

      <div
        class="cr-skeleton__avatar cr-skeleton__shimmer"
        aria-hidden="true">
      </div>

      <div class="cr-skeleton__profile-info">

        <div
          class="cr-skeleton__line cr-skeleton__line--name cr-skeleton__shimmer"
          aria-hidden="true">
        </div>

        <div
          class="cr-skeleton__line cr-skeleton__line--role cr-skeleton__shimmer"
          aria-hidden="true">
        </div>

      </div>

      <div
        class="cr-skeleton__badge cr-skeleton__shimmer"
        aria-hidden="true">
      </div>

    </div>


    <!-- MEDIA -->
    <div
      class="cr-skeleton__media cr-skeleton__shimmer"
      aria-hidden="true">

      <div class="cr-skeleton__media-icon">
        <span></span>
      </div>

    </div>


    <!-- CONTENT -->
    <div class="cr-skeleton__content">

      <!-- TITLE -->
      <div
        class="cr-skeleton__line cr-skeleton__line--title cr-skeleton__shimmer"
        aria-hidden="true">
      </div>


      <!-- TEXT -->
      <div class="cr-skeleton__text">

        <div
          class="cr-skeleton__line cr-skeleton__line--full cr-skeleton__shimmer"
          aria-hidden="true">
        </div>

        <div
          class="cr-skeleton__line cr-skeleton__line--full cr-skeleton__shimmer"
          aria-hidden="true">
        </div>

        <div
          class="cr-skeleton__line cr-skeleton__line--medium cr-skeleton__shimmer"
          aria-hidden="true">
        </div>

      </div>


      <!-- TAGS -->
      <div class="cr-skeleton__tags">

        <div
          class="cr-skeleton__tag cr-skeleton__shimmer"
          aria-hidden="true">
        </div>

        <div
          class="cr-skeleton__tag cr-skeleton__shimmer"
          aria-hidden="true">
        </div>

        <div
          class="cr-skeleton__tag cr-skeleton__shimmer"
          aria-hidden="true">
        </div>

      </div>


      <!-- FOOTER -->
      <div class="cr-skeleton__footer">

        <div class="cr-skeleton__meta">

          <div
            class="cr-skeleton__meta-icon cr-skeleton__shimmer"
            aria-hidden="true">
          </div>

          <div
            class="cr-skeleton__line cr-skeleton__line--meta cr-skeleton__shimmer"
            aria-hidden="true">
          </div>

        </div>

        <div
          class="cr-skeleton__button cr-skeleton__shimmer"
          aria-hidden="true">
        </div>

      </div>

    </div>


    <!-- LOADING STATUS -->
    <div class="cr-skeleton__status">

      <span class="cr-skeleton__status-dot"></span>

      <span>Loading content</span>

      <span
        class="cr-skeleton__status-dots"
        aria-hidden="true">

        <i></i>
        <i></i>
        <i></i>

      </span>

    </div>

  </div>

</div>

  
</body>
</html>
