<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Fly-In Navigation Menu | CodeRipple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-stage">
<div class="cr-slide-menu-wrap">

  <button class="cr-menu-toggle" type="button">
    <span class="cr-menu-toggle-icon">☰</span>
    <span>Toggle Menu</span>
  </button>

  <nav class="cr-slide-menu">

    <div class="cr-slide-menu-head">

      <span>CodeRipple</span>

      <button
        class="cr-menu-close"
        type="button"
        aria-label="Close menu">
        ×
      </button>

    </div>

    <ul class="cr-menu-list">

      <li>
        <a href="#" class="active">Home</a>
      </li>

      <li>
        <a href="#">Components</a>
      </li>

      <li>
        <a href="#">Categories</a>
      </li>

      <li>
        <a href="#">Playground</a>
      </li>

      <li>
        <a href="#">Blog</a>
      </li>

      <li>
        <a href="#">About</a>
      </li>

    </ul>

  </nav>

</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
