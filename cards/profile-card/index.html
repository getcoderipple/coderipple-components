<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card | CodeRipple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="profile-card">

  <div class="profile-avatar">AM</div>

  <h2>Alex Morgan</h2>
  <span class="profile-role">Frontend Developer</span>

  <p class="profile-bio">
    Building clean interfaces and simple user experiences.
  </p>

  <div class="profile-stats">

    <div>
      <strong>128</strong>
      <span>Projects</span>
    </div>

    <div>
      <strong>8.4K</strong>
      <span>Followers</span>
    </div>

    <div>
      <strong>312</strong>
      <span>Following</span>
    </div>

  </div>

  <div class="profile-actions">
    <button class="profile-primary-btn">Follow</button>
    <button class="profile-secondary-btn">Message</button>
  </div>

</div>

</body>
</html>
