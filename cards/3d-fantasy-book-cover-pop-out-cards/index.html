<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Fantasy Book Cover Pop-Out Cards | CodeRipple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="fantasy-showcase">

  <!-- DARK RIDER -->
  <a href="#" class="fantasy-card-link">

    <div class="fantasy-card">

      <div class="fantasy-cover">
        <img
          src="assets/The%20Dark%20Rider.png"
          alt="The Dark Rider book cover"
        />
      </div>

      <img
        src="assets/The%20Dark%20Rider%20Character.png"
        class="fantasy-character"
        alt="Dark Rider character"
      />

    </div>

  </a>


  <!-- FORCE MAGE -->
  <a href="#" class="fantasy-card-link">

    <div class="fantasy-card">

      <div class="fantasy-cover">
        <img
          src="assets/Force%20Mage.png"
          alt="Force Mage book cover"
        />
      </div>

      <img
        src="assets/Force%20Mage%20Character.png"
        class="fantasy-character"
        alt="Force Mage character"
      />

    </div>

  </a>

</div>
<script src="script.js"></script>
</body>
</html>
