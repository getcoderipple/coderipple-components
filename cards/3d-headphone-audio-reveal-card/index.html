<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Headphone Audio Reveal Card | CodeRipple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="audio-stage">

  <div class="audio-product-card" id="audioCard">

    <button
      class="audio-trigger"
      id="audioTrigger"
      aria-label="Open Neon Pulse card"
    >
      <img
        src="assets/Audio-Pulse-Logo.png"
        alt="Neon Pulse audio logo"
      >
    </button>

    <div class="audio-content">

      <div class="audio-copy">

        <span class="audio-kicker">
          IMMERSIVE SOUND
        </span>

        <h2>NEON PULSE</h2>

        <p>
          Feel every beat with powerful sound,
          deep bass and futuristic comfort.
        </p>

        <a href="#" class="audio-btn">
          Listen Now
        </a>

      </div>

      <div
        class="audio-equalizer"
        aria-hidden="true"
      >
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <img
        src="assets/Neon-Headphone.png"
        class="audio-headphones"
        alt="Futuristic black and cyan neon headphones"
      >

    </div>

  </div>

</div>
<script src="script.js"></script>
</body>
</html>
