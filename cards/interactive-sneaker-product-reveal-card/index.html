<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Sneaker Product Reveal Card | CodeRipple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="volt-stage">

  <div class="volt-product-card" id="voltCard">

    <button
      class="volt-trigger"
      id="voltTrigger"
      aria-label="Open Volt Step card"
    >
      <img
        src="assets/VS-Logo.png"
        alt="Volt Step logo"
      >
    </button>

    <div class="volt-content">

      <div class="volt-copy">

        <span class="volt-kicker">
          FUTURE MOTION
        </span>

        <h2>VOLT STEP</h2>

        <p>
          Built for speed, comfort and electric style.
        </p>

        <a href="#" class="volt-btn">
          Explore Sneaker
        </a>

      </div>

      <img
        src="assets/VS-Sneaker.png"
        class="volt-sneaker"
        alt="Volt Step futuristic sneaker"
      >

    </div>

  </div>

</div>
<script src="script.js"></script>
</body>
</html>
